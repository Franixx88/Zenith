name: Test and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            suffix: ''
          - os: windows-latest
            platform: windows-x86_64
            suffix: .exe
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      ZENITH_SYZYGY_PATH: '<empty>'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: |
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Rust checks and tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo check --locked --manifest-path tools/binpack/Cargo.toml
      - name: Native release build
        run: cargo build --release --locked --bin zenith
      - name: Python and native bridge checks
        env:
          ZENITH_TEST_ENGINE: ${{ github.workspace }}/target/release/zenith${{ matrix.suffix }}
        run: |
          python -m pip install -r tools/requirements-engine-test.txt
          python -m unittest discover -s tools -p test_engine_test.py -v
          python -m unittest discover -s analysis -p test_server.py -v
          python -m unittest discover -s tools/nnue -p test_corpus_tools.py -v
          python -m unittest discover -s tools/nnue -p test_awake_time.py -v
      - name: Package release candidate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python tools/package_release.py --binary target/release/zenith${{ matrix.suffix }} --platform ${{ matrix.platform }} --commit "$GITHUB_SHA"
      - name: Upload release candidate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zenith-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish a new version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zenith-*
          path: dist
          merge-multiple: true
      - name: Publish once, keeping existing tags immutable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${tag} is already published; keeping it unchanged."
            exit 0
          fi
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "${tag}^{commit}")" = "$GITHUB_SHA" || {
              echo "Existing tag points to another commit; refusing to replace it."
              exit 1
            }
          fi
          test -f "docs/releases/${tag}.md"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Zenith ${tag}" --notes-file "docs/releases/${tag}.md" --latest
